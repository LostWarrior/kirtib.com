name: Deploy site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Install Hugo
        env:
          # Keep the deploy build aligned with the historical site/theme output
          # until the site is upgraded from the legacy Pickles theme.
          HUGO_VERSION: 0.40.1
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_Linux-64bit.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -C "${RUNNER_TEMP}/hugo-bin" -xzf "${RUNNER_TEMP}/hugo.tar.gz"
          chmod +x "${RUNNER_TEMP}/hugo-bin/hugo"
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Verify Hugo
        run: hugo version

      - name: Build site
        env:
          HUGO_ENV: production
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          rm -rf "${SITE_DIR}"
          mkdir -p "${SITE_DIR}"
          hugo --destination "${SITE_DIR}" --baseURL "${{ steps.pages.outputs.base_url }}/"
          if [[ -f CNAME ]]; then
            cp CNAME "${SITE_DIR}/CNAME"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
